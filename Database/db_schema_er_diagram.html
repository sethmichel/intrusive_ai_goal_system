<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = false;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  SCHEDULED_TASKS ||--o{ SCHEDULED_TASK_OPERATIONS : generates
  SCHEDULED_TASKS ||--o{ TASK_BLOCKED_APPS : triggers_block_for
  LEETCODE_PROBLEMS ||--o{ LEETCODE_RECOMMENDATIONS : recommended_as
  LONG_TERM_GOALS ||--o{ GOAL_BULLETS : has_up_to_2
  LONG_TERM_GOALS ||--o{ GOAL_CHECKINS : tracked_by
  SCHEDULED_TASKS {
    uuid id PK
    string task_name
    int frequency_days
    string importance
    time time_of_day
    string reason
    date date_added
    bool is_block_trigger
  }
  SCHEDULED_TASK_OPERATIONS {
    uuid id PK
    uuid task_id FK
    timestamp recommended_at
    bool completed
    string missed_reason
  }
  TASK_BLOCKED_APPS {
    uuid id PK
    uuid task_id FK
    string app_token
  }
  LEETCODE_PROBLEMS {
    uuid id PK
    string title
    string category
    string difficulty
  }
  LEETCODE_RECOMMENDATIONS {
    uuid id PK
    uuid problem_id FK
    date date
    bool completed
  }
  LONG_TERM_GOALS {
    uuid id PK
    string goal
    string blocking_reason
    date date_added
    date next_reminder_date
    int annoyance_scalar
  }
  GOAL_BULLETS {
    uuid id PK
    uuid goal_id FK
    string bullet_text
    date date_added
  }
  GOAL_CHECKINS {
    uuid id PK
    uuid goal_id FK
    date checkin_date
    string user_response
    int annoyance_scalar_after
    bool bullet_1_done
    bool bullet_2_done
  }`);
document.getElementById('erd').innerHTML = svg;
document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});
document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
